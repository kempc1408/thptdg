        function renderArticle() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            const localArticlesList = JSON.parse(localStorage.getItem('posted_articles') || '[]');
            let currentArticle = localArticlesList.find(item => item.id === id);

            if (!currentArticle) {
                currentArticle = defaultArticles[id] || defaultArticles["1700000000000"];
            }

            document.getElementById('page-title').innerText = currentArticle.title + " - THPT Dầu Giây";
            document.getElementById('article-title').innerText = currentArticle.title;
            document.getElementById('article-author').innerText = currentArticle.author || "Hiệu Trưởng";
            document.getElementById('article-lead').innerText = currentArticle.lead;
            document.getElementById('article-body').innerHTML = currentArticle.body;
        }

        function initTheme() {
            const themeBtn = document.getElementById('theme-toggle');
            const darkIcon = document.getElementById('theme-toggle-dark-icon');
            const lightIcon = document.getElementById('theme-toggle-light-icon');
            
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                if(lightIcon) lightIcon.classList.remove('hidden');
                if(darkIcon) darkIcon.classList.add('hidden');
            }

            if(themeBtn) {
                themeBtn.addEventListener('click', () => {
                    if (document.documentElement.classList.contains('dark')) {
                        document.documentElement.classList.remove('dark');
                        localStorage.setItem('theme', 'light');
                        if(lightIcon) lightIcon.classList.add('hidden');
                        if(darkIcon) darkIcon.classList.remove('hidden');
                    } else {
                        document.documentElement.classList.add('dark');
                        localStorage.setItem('theme', 'dark');
                        if(lightIcon) lightIcon.classList.remove('hidden');
                        if(darkIcon) darkIcon.classList.add('hidden');
                    }
                });
            }
        }

        function checkUserSession() {
